sources:
  workbuddy-postgres:
    kind: postgres
    host: ${WORKBUDDY_PG_HOST}
    port: ${WORKBUDDY_PG_PORT}
    database: ${WORKBUDDY_PG_DATABASE}
    user: ${WORKBUDDY_PG_USER}
    password: ${WORKBUDDY_PG_PASSWORD}

tools:
  list_workbuddy_public_tables:
    kind: postgres-sql
    source: workbuddy-postgres
    description: Lists public schema tables for read-only data governance review.
    statement: |
      SELECT table_schema, table_name
      FROM information_schema.tables
      WHERE table_schema = 'public'
      ORDER BY table_schema, table_name;

  describe_workbuddy_public_columns:
    kind: postgres-sql
    source: workbuddy-postgres
    description: Describes public schema columns for read-only data governance review.
    statement: |
      SELECT table_schema, table_name, column_name, data_type, is_nullable
      FROM information_schema.columns
      WHERE table_schema = 'public'
      ORDER BY table_schema, table_name, ordinal_position;

toolsets:
  workbuddy-data-readonly:
    - list_workbuddy_public_tables
    - describe_workbuddy_public_columns
