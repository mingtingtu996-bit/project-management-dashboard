name: workbuddy-ingress

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: workbuddy-domain-ingress
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${INGRESS_ENV_FILE:-./env/ingress.env}
    volumes:
      - ${INGRESS_CADDYFILE:-./ingress/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR:-/opt/workbuddy-ingress/data}:/data
      - ${CADDY_CONFIG_DIR:-/opt/workbuddy-ingress/config}:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
