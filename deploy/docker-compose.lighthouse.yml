services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
      target: prebuilt-runtime
    container_name: ${COMPOSE_PROJECT_NAME:-project-management}-api
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - ./env/server.production.env
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: api
      HOST: 0.0.0.0
      PORT: 3001
      LOG_PERSIST: "false"
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required}
      DEPLOY_TARGET: ${DEPLOY_TARGET:?DEPLOY_TARGET is required}
      EXPECTED_SCHEMA_MIGRATION_FILENAME: ${EXPECTED_SCHEMA_MIGRATION_FILENAME:?EXPECTED_SCHEMA_MIGRATION_FILENAME is required}
      EXPECTED_SCHEMA_MIGRATION_CHECKSUM: ${EXPECTED_SCHEMA_MIGRATION_CHECKSUM:?EXPECTED_SCHEMA_MIGRATION_CHECKSUM is required}
      SKIP_SCHEDULER_BOOT: "true"
      SKIP_READ_MODEL_WARMUP: "false"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile
      target: prebuilt-runtime
    container_name: ${COMPOSE_PROJECT_NAME:-project-management}-worker
    restart: unless-stopped
    env_file:
      - ./env/server.production.env
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: worker
      TZ: Asia/Shanghai
      HOST: 127.0.0.1
      PORT: 3001
      LOG_PERSIST: "false"
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required}
      DEPLOY_TARGET: ${DEPLOY_TARGET:?DEPLOY_TARGET is required}
      EXPECTED_SCHEMA_MIGRATION_FILENAME: ${EXPECTED_SCHEMA_MIGRATION_FILENAME:?EXPECTED_SCHEMA_MIGRATION_FILENAME is required}
      EXPECTED_SCHEMA_MIGRATION_CHECKSUM: ${EXPECTED_SCHEMA_MIGRATION_CHECKSUM:?EXPECTED_SCHEMA_MIGRATION_CHECKSUM is required}
      SKIP_SCHEDULER_BOOT: "false"
      SKIP_REFERENCE_DATA_BOOTSTRAP: "true"
      SKIP_READ_MODEL_WARMUP: "true"
      DB_POOL_MAX: "5"
      DB_POOL_WARM_CONNECTIONS: "1"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: ../client
      dockerfile: Dockerfile
      target: prebuilt-runtime
    container_name: ${COMPOSE_PROJECT_NAME:-project-management}-web
    restart: unless-stopped
    environment:
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required}
      DEPLOY_TARGET: ${DEPLOY_TARGET:?DEPLOY_TARGET is required}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/lighthouse.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1/api/readyz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
