name: Bootstrap Staging Known Hosts

on:
  push:
    branches:
      - codex/staging-known-hosts-bootstrap

permissions:
  contents: read

jobs:
  scan-staging-host:
    name: Scan Staging SSH Host Key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Validate staging SSH target
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ]; then
            echo "STAGING_DEPLOY_HOST is required" >&2
            exit 1
          fi

      - name: Scan candidate host keys
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p host-key-candidate
          port="${DEPLOY_PORT:-22}"
          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -p "$port" -H "$DEPLOY_HOST" \
              >> host-key-candidate/scanned-known-hosts 2>/dev/null || true
            if [ -s host-key-candidate/scanned-known-hosts ]; then
              break
            fi
            sleep 2
          done
          if [ ! -s host-key-candidate/scanned-known-hosts ]; then
            echo "No SSH host key was returned by the staging target" >&2
            exit 1
          fi
          sort -u host-key-candidate/scanned-known-hosts \
            -o host-key-candidate/scanned-known-hosts

      - name: Upload candidate keys
        uses: actions/upload-artifact@v4
        with:
          name: staging-host-key-candidate
          path: host-key-candidate/scanned-known-hosts
          if-no-files-found: error
          retention-days: 1

  verify-against-production-trust:
    name: Verify Against Production SSH Trust
    needs: scan-staging-host
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - name: Download candidate keys
        uses: actions/download-artifact@v4
        with:
          name: staging-host-key-candidate
          path: host-key-candidate

      - name: Match candidate keys to trusted production fingerprints
        env:
          TRUSTED_KNOWN_HOSTS: ${{ secrets.PRODUCTION_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$TRUSTED_KNOWN_HOSTS" ]; then
            echo "PRODUCTION_DEPLOY_KNOWN_HOSTS is required" >&2
            exit 1
          fi
          printf '%s\n' "$TRUSTED_KNOWN_HOSTS" > trusted-known-hosts
          ssh-keygen -lf trusted-known-hosts -E sha256 \
            | awk '{print $2}' \
            | sort -u > trusted-fingerprints
          : > verified-known-hosts
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            printf '%s\n' "$candidate" > candidate-line
            fingerprint="$(ssh-keygen -lf candidate-line -E sha256 | awk '{print $2}')"
            if grep -Fqx "$fingerprint" trusted-fingerprints; then
              printf '%s\n' "$candidate" >> verified-known-hosts
            fi
          done < host-key-candidate/scanned-known-hosts
          sort -u verified-known-hosts -o verified-known-hosts
          if [ ! -s verified-known-hosts ]; then
            echo "Staging SSH host key does not match the trusted production host" >&2
            exit 1
          fi
          ssh-keygen -lf verified-known-hosts -E sha256 \
            | awk '{print $2, $4}' > verified-fingerprints.txt

      - name: Upload verified hashed known-hosts
        uses: actions/upload-artifact@v4
        with:
          name: staging-known-hosts-verified
          path: |
            verified-known-hosts
            verified-fingerprints.txt
          if-no-files-found: error
          retention-days: 1
