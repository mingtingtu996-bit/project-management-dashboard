name: Production Server Worktree Maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect, diagnose, restart the existing runtime, or back up and clean tracked server worktree changes.
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - runtime-diagnostics
          - runtime-restart
          - backup-and-clean-tracked
      confirmation:
        description: Type BACKUP_AND_CLEAN_TRACKED_CHANGES for clean mode or RESTART_PRODUCTION_RUNTIME for restart mode.
        required: false
        default: ""
        type: string

concurrency:
  group: production-server-worktree-maintenance
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  worktree-maintenance:
    name: Worktree Maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_PRIVATE_KEY" ]; then
            echo "Missing required deploy SSH secrets." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/workbuddy-production-maintenance
          chmod 600 ~/.ssh/workbuddy-production-maintenance
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Inspect or clean production worktree
        if: ${{ inputs.mode != 'runtime-diagnostics' && inputs.mode != 'runtime-restart' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          OUTPUT_ROOT: project-testing/reports/production-server-worktree-maintenance-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "Missing required deploy location secrets." >&2
            exit 1
          fi
          if [ "$MODE" = "backup-and-clean-tracked" ] && [ "$CONFIRMATION" != "BACKUP_AND_CLEAN_TRACKED_CHANGES" ]; then
            echo "Refusing clean mode without the required confirmation phrase." >&2
            exit 1
          fi

          mkdir -p "$OUTPUT_ROOT"
          remote_root="$DEPLOY_PATH/.workbuddy-server-worktree-maintenance/${GITHUB_RUN_ID}"
          remote_script="$remote_root/maintenance.sh"
          remote_meta="$remote_root/maintenance-meta.env"
          local_script="$OUTPUT_ROOT/maintenance.sh"

          cat > "$local_script" <<'MAINTENANCE_SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if [ ! -d .git ]; then
            echo "Deployment directory is not a git repository." >&2
            exit 1
          fi

          backup_root=".workbuddy-server-worktree-maintenance/${RUN_ID}"
          backup_dir="${backup_root}/backup"
          mkdir -p "$backup_dir"

          status_file="${backup_dir}/tracked-status.before.txt"
          name_status_file="${backup_dir}/tracked-name-status.before.txt"
          diff_stat_file="${backup_dir}/tracked-diff-stat.before.txt"
          patch_file="${backup_dir}/tracked-changes.before.patch"
          meta_file="${backup_root}/maintenance-meta.env"

          git status --porcelain=v1 --untracked-files=no > "$status_file"
          git diff --name-status HEAD -- > "$name_status_file"
          git diff --stat HEAD -- > "$diff_stat_file"
          git diff --binary HEAD -- > "$patch_file"
          head_before="$(git rev-parse HEAD)"
          branch_before="$(git rev-parse --abbrev-ref HEAD)"
          change_count="$(wc -l < "$status_file" | tr -d ' ')"
          patch_sha="$(sha256sum "$patch_file" | awk '{print $1}')"
          dirty_before="false"
          if [ "$change_count" != "0" ]; then
            dirty_before="true"
          fi

          cleaned="false"
          if [ "$MODE" = "backup-and-clean-tracked" ]; then
            if [ "$CONFIRMATION" != "BACKUP_AND_CLEAN_TRACKED_CHANGES" ]; then
              echo "Missing confirmation phrase." >&2
              exit 1
            fi
            git reset --hard HEAD >/dev/null
            cleaned="true"
          fi

          git status --porcelain=v1 --untracked-files=no > "${backup_dir}/tracked-status.after.txt"
          dirty_after="false"
          if [ -s "${backup_dir}/tracked-status.after.txt" ]; then
            dirty_after="true"
          fi

          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'schema_version=%s\n' 'workbuddy-production-server-worktree-maintenance/v1'
            printf 'generated_at=%s\n' "$generated_at"
            printf 'run_id=%s\n' "$RUN_ID"
            printf 'mode=%s\n' "$MODE"
            printf 'backup_root=%s\n' "$backup_root"
            printf 'backup_dir=%s\n' "$backup_dir"
            printf 'head_before=%s\n' "$head_before"
            printf 'branch_before=%s\n' "$branch_before"
            printf 'change_count=%s\n' "$change_count"
            printf 'patch_sha=%s\n' "$patch_sha"
            printf 'dirty_before=%s\n' "$dirty_before"
            printf 'dirty_after=%s\n' "$dirty_after"
            printf 'cleaned=%s\n' "$cleaned"
          } > "$meta_file"
          MAINTENANCE_SCRIPT

          ssh -i ~/.ssh/workbuddy-production-maintenance -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$remote_root'"
          scp -i ~/.ssh/workbuddy-production-maintenance -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$local_script" "$DEPLOY_USER@$DEPLOY_HOST:$remote_script"
          ssh -i ~/.ssh/workbuddy-production-maintenance -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RUN_ID='${GITHUB_RUN_ID}' MODE='$MODE' CONFIRMATION='$CONFIRMATION' bash '$remote_script'"

          scp -i ~/.ssh/workbuddy-production-maintenance -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_meta" "$OUTPUT_ROOT/maintenance-meta.env"
          scp -i ~/.ssh/workbuddy-production-maintenance -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_root/backup/tracked-status.before.txt" "$OUTPUT_ROOT/tracked-status.before.txt"
          scp -i ~/.ssh/workbuddy-production-maintenance -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_root/backup/tracked-name-status.before.txt" "$OUTPUT_ROOT/tracked-name-status.before.txt"
          scp -i ~/.ssh/workbuddy-production-maintenance -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_root/backup/tracked-status.after.txt" "$OUTPUT_ROOT/tracked-status.after.txt"

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const root = process.env.OUTPUT_ROOT;
          const parseMeta = (text) => Object.fromEntries(
            text.split(/\r?\n/u)
              .filter(Boolean)
              .map((line) => {
                const index = line.indexOf('=');
                return [line.slice(0, index), line.slice(index + 1)];
              }),
          );
          const readLines = (file) => readFileSync(`${root}/${file}`, 'utf8')
            .split(/\r?\n/u)
            .filter(Boolean);
          const meta = parseMeta(readFileSync(`${root}/maintenance-meta.env`, 'utf8'));
          const backupDir = meta.backup_dir;
          const summary = {
            schemaVersion: meta.schema_version,
            generatedAt: meta.generated_at,
            runId: meta.run_id,
            mode: meta.mode,
            backupRoot: meta.backup_root,
            backupFiles: [
              `${backupDir}/tracked-status.before.txt`,
              `${backupDir}/tracked-name-status.before.txt`,
              `${backupDir}/tracked-diff-stat.before.txt`,
              `${backupDir}/tracked-changes.before.patch`,
              `${backupDir}/tracked-status.after.txt`,
            ],
            headBefore: meta.head_before,
            branchBefore: meta.branch_before,
            trackedChangeCountBefore: Number(meta.change_count || 0),
            trackedStatusBefore: readLines('tracked-status.before.txt'),
            trackedNameStatusBefore: readLines('tracked-name-status.before.txt'),
            trackedStatusAfter: readLines('tracked-status.after.txt'),
            dirtyBefore: meta.dirty_before === 'true',
            dirtyAfter: meta.dirty_after === 'true',
            cleaned: meta.cleaned === 'true',
            patchSha256: meta.patch_sha,
            boundary: {
              trackedFilesOnly: true,
              untrackedFilesPreserved: true,
              envValuesWritten: false,
              secretValuesWritten: false,
              patchStoredOnProductionServerOnly: true,
            },
          };
          writeFileSync(`${root}/maintenance-summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
          NODE
          test -s "$OUTPUT_ROOT/maintenance-summary.json"

      - name: Collect runtime diagnostics
        if: ${{ inputs.mode == 'runtime-diagnostics' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          OUTPUT_ROOT: project-testing/reports/production-server-worktree-maintenance-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "Missing required deploy location secrets." >&2
            exit 1
          fi

          mkdir -p "$OUTPUT_ROOT"
          remote_root="$DEPLOY_PATH/.workbuddy-server-worktree-maintenance/${GITHUB_RUN_ID}"
          remote_script="$remote_root/runtime-diagnostics.sh"
          remote_report="$remote_root/runtime-diagnostics.raw.txt"
          local_script="$OUTPUT_ROOT/runtime-diagnostics.sh"

          cat > "$local_script" <<'DIAGNOSTICS_SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          report=".workbuddy-server-worktree-maintenance/${RUN_ID}/runtime-diagnostics.raw.txt"
          mkdir -p "$(dirname "$report")"

          if docker info >/dev/null 2>&1; then
            docker_cmd="docker"
          elif sudo -n docker info >/dev/null 2>&1; then
            docker_cmd="sudo -n docker"
          else
            echo "Docker is not available for diagnostics." >&2
            exit 1
          fi

          {
            echo "schemaVersion=workbuddy-production-runtime-diagnostics/v1"
            echo "generatedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runId=$RUN_ID"
            echo "releaseHead=$(git rev-parse HEAD 2>/dev/null || true)"
            echo
            echo "## docker ps"
            $docker_cmd ps -a --filter "name=project-management" --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
            echo
            echo "## api health inspect"
            $docker_cmd inspect project-management-api --format '{{json .State.Health}}' || true
            echo
            echo "## api container state"
            $docker_cmd inspect project-management-api --format 'status={{.State.Status}} running={{.State.Running}} exitCode={{.State.ExitCode}} error={{.State.Error}} startedAt={{.State.StartedAt}} finishedAt={{.State.FinishedAt}}' || true
            echo
            echo "## api logs tail"
            $docker_cmd logs --tail 200 project-management-api 2>&1 || true
            echo
            echo "## local health curl"
            curl --fail --silent --show-error http://127.0.0.1:3001/api/health 2>&1 || true
          } > "$report"
          DIAGNOSTICS_SCRIPT

          ssh -i ~/.ssh/workbuddy-production-maintenance -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$remote_root'"
          scp -i ~/.ssh/workbuddy-production-maintenance -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$local_script" "$DEPLOY_USER@$DEPLOY_HOST:$remote_script"
          ssh -i ~/.ssh/workbuddy-production-maintenance -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RUN_ID='${GITHUB_RUN_ID}' bash '$remote_script'"
          scp -i ~/.ssh/workbuddy-production-maintenance -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_report" "$OUTPUT_ROOT/runtime-diagnostics.raw.txt"

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const root = process.env.OUTPUT_ROOT;
          const raw = readFileSync(`${root}/runtime-diagnostics.raw.txt`, 'utf8');
          const redacted = raw
            .replace(/(postgres(?:ql)?:\/\/)[^\s'"<>]+/giu, '$1[REDACTED]')
            .replace(/(https?:\/\/[^\/\s'"<>]*supabase\.[^\s'"<>]+)/giu, '[REDACTED_SUPABASE_URL]')
            .replace(/(service[_-]?role[_-]?key|anon[_-]?key|jwt[_-]?secret|password|secret|token)([=:]\s*)[^\s'"<>]+/giu, '$1$2[REDACTED]')
            .replace(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/gu, '[REDACTED_JWT]');
          writeFileSync(`${root}/runtime-diagnostics.txt`, redacted);

          const lower = redacted.toLowerCase();
          const summary = {
            schemaVersion: 'workbuddy-production-runtime-diagnostics/v1',
            generatedAt: new Date().toISOString(),
            runId: process.env.GITHUB_RUN_ID,
            apiUnhealthy: lower.includes('unhealthy'),
            apiExited: lower.includes('status=exited') || lower.includes('running=false'),
            healthCurlFailed: lower.includes('curl:') || lower.includes('failed to connect'),
            secretValuesWritten: false,
            envValuesWritten: false,
            diagnosticsOnly: true,
            rawReportStoredOnProductionServer: true,
          };
          writeFileSync(`${root}/runtime-diagnostics-summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
          NODE
          rm -f "$OUTPUT_ROOT/runtime-diagnostics.raw.txt"
          test -s "$OUTPUT_ROOT/runtime-diagnostics.txt"

      - name: Restart production runtime
        if: ${{ inputs.mode == 'runtime-restart' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
          CONFIRMATION: ${{ inputs.confirmation }}
          OUTPUT_ROOT: project-testing/reports/production-server-worktree-maintenance-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ] || [ -z "$DEPLOY_HEALTH_URL" ]; then
            echo "Missing required deploy location or health URL secrets." >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != "RESTART_PRODUCTION_RUNTIME" ]; then
            echo "Refusing runtime restart without the required confirmation phrase." >&2
            exit 1
          fi

          mkdir -p "$OUTPUT_ROOT"
          remote_root="/tmp/workbuddy-production-runtime-restart/${GITHUB_RUN_ID}"
          remote_script="$remote_root/runtime-restart.sh"
          remote_meta="$remote_root/runtime-restart-meta.env"
          local_script="$OUTPUT_ROOT/runtime-restart.sh"

          cleanup_restart_remote() {
            ssh -i ~/.ssh/workbuddy-production-maintenance -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "rm -rf '$remote_root'" >/dev/null 2>&1 || true
          }
          trap cleanup_restart_remote EXIT

          cat > "$local_script" <<'RESTART_SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          report="$REMOTE_ROOT/runtime-restart-meta.env"
          mkdir -p "$(dirname "$report")"

          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          release_head="$(git rev-parse HEAD 2>/dev/null || true)"
          if docker info >/dev/null 2>&1; then
            docker_cmd=(docker)
            docker_available="true"
          elif sudo -n docker info >/dev/null 2>&1; then
            docker_cmd=(sudo -n docker)
            docker_available="true"
          else
            docker_available="false"
            {
              printf 'schema_version=%s\n' 'workbuddy-production-runtime-restart/v1'
              printf 'generated_at=%s\n' "$generated_at"
              printf 'run_id=%s\n' "$RUN_ID"
              printf 'release_head=%s\n' "$release_head"
              printf 'docker_available=%s\n' "$docker_available"
              printf 'api_before_status=%s\n' 'unknown'
              printf 'api_after_status=%s\n' 'unknown'
              printf 'web_before_status=%s\n' 'unknown'
              printf 'web_after_status=%s\n' 'unknown'
              printf 'local_health_passed=%s\n' 'false'
              printf 'recovery_succeeded=%s\n' 'false'
            } > "$report"
            exit 1
          fi

          container_status() {
            "${docker_cmd[@]}" container inspect "$1" --format '{{.State.Status}}' 2>/dev/null || printf 'missing'
          }

          api_before_status="$(container_status project-management-api)"
          web_before_status="$(container_status project-management-web)"
          api_started="false"
          web_started="false"
          local_health_passed="false"

          if "${docker_cmd[@]}" container inspect project-management-api >/dev/null 2>&1; then
            if "${docker_cmd[@]}" start project-management-api >/dev/null; then
              api_started="true"
            fi
          elif "${docker_cmd[@]}" compose -f deploy/docker-compose.lighthouse.yml up -d --no-build --no-deps api >/dev/null; then
            api_started="true"
          fi

          if [ "$api_started" = "true" ]; then
            for _attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
                local_health_passed="true"
                break
              fi
              sleep 4
            done
          fi

          if [ "$local_health_passed" = "true" ]; then
            if "${docker_cmd[@]}" container inspect project-management-web >/dev/null 2>&1; then
              if "${docker_cmd[@]}" start project-management-web >/dev/null; then
                web_started="true"
              fi
            elif "${docker_cmd[@]}" compose -f deploy/docker-compose.lighthouse.yml up -d --no-build --no-deps web >/dev/null; then
              web_started="true"
            fi
          fi

          api_after_status="$(container_status project-management-api)"
          web_after_status="$(container_status project-management-web)"
          recovery_succeeded="false"
          if [ "$local_health_passed" = "true" ] && [ "$api_after_status" = "running" ] && [ "$web_after_status" = "running" ]; then
            recovery_succeeded="true"
          fi

          {
            printf 'schema_version=%s\n' 'workbuddy-production-runtime-restart/v1'
            printf 'generated_at=%s\n' "$generated_at"
            printf 'run_id=%s\n' "$RUN_ID"
            printf 'release_head=%s\n' "$release_head"
            printf 'docker_available=%s\n' "$docker_available"
            printf 'api_before_status=%s\n' "$api_before_status"
            printf 'api_after_status=%s\n' "$api_after_status"
            printf 'web_before_status=%s\n' "$web_before_status"
            printf 'web_after_status=%s\n' "$web_after_status"
            printf 'api_started=%s\n' "$api_started"
            printf 'web_started=%s\n' "$web_started"
            printf 'local_health_passed=%s\n' "$local_health_passed"
            printf 'recovery_succeeded=%s\n' "$recovery_succeeded"
          } > "$report"

          if [ "$recovery_succeeded" != "true" ]; then
            exit 1
          fi
          RESTART_SCRIPT

          ssh -i ~/.ssh/workbuddy-production-maintenance -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$remote_root'"
          scp -i ~/.ssh/workbuddy-production-maintenance -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$local_script" "$DEPLOY_USER@$DEPLOY_HOST:$remote_script"
          set +e
          ssh -i ~/.ssh/workbuddy-production-maintenance -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' REMOTE_ROOT='$remote_root' RUN_ID='${GITHUB_RUN_ID}' bash '$remote_script'"
          restart_status=$?
          set -e
          scp -i ~/.ssh/workbuddy-production-maintenance -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_meta" "$OUTPUT_ROOT/runtime-restart-meta.env"

          public_health_passed="false"
          if [ "$restart_status" -eq 0 ]; then
            for _attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 15 "$DEPLOY_HEALTH_URL" >/dev/null 2>&1; then
                public_health_passed="true"
                break
              fi
              sleep 5
            done
          fi
          if [ "$public_health_passed" != "true" ]; then
            restart_status=1
          fi
          export PUBLIC_HEALTH_PASSED="$public_health_passed"

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const root = process.env.OUTPUT_ROOT;
          const meta = Object.fromEntries(
            readFileSync(`${root}/runtime-restart-meta.env`, 'utf8')
              .split(/\r?\n/u)
              .filter(Boolean)
              .map((line) => {
                const index = line.indexOf('=');
                return [line.slice(0, index), line.slice(index + 1)];
              }),
          );
          const publicHealthPassed = process.env.PUBLIC_HEALTH_PASSED === 'true';
          const summary = {
            schemaVersion: meta.schema_version,
            generatedAt: meta.generated_at,
            runId: meta.run_id,
            releaseHead: meta.release_head,
            dockerAvailable: meta.docker_available === 'true',
            apiBeforeStatus: meta.api_before_status,
            apiAfterStatus: meta.api_after_status,
            webBeforeStatus: meta.web_before_status,
            webAfterStatus: meta.web_after_status,
            apiStarted: meta.api_started === 'true',
            webStarted: meta.web_started === 'true',
            localHealthPassed: meta.local_health_passed === 'true',
            publicHealthPassed,
            recoverySucceeded: meta.recovery_succeeded === 'true' && publicHealthPassed,
            boundary: {
              existingContainersPreferred: true,
              imageBuildAllowed: false,
              databaseMigrationAllowed: false,
              sourceMutationAllowed: false,
              secretValuesWritten: false,
              envValuesWritten: false,
            },
          };
          writeFileSync(`${root}/runtime-restart-summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
          NODE
          rm -f "$OUTPUT_ROOT/runtime-restart-meta.env"
          test -s "$OUTPUT_ROOT/runtime-restart-summary.json"
          exit "$restart_status"

      - name: Publish maintenance summary
        if: always()
        env:
          OUTPUT_ROOT: project-testing/reports/production-server-worktree-maintenance-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -f "$OUTPUT_ROOT/maintenance-summary.json" ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const summary = JSON.parse(readFileSync(`${process.env.OUTPUT_ROOT}/maintenance-summary.json`, 'utf8'));
          console.log('# Production Server Worktree Maintenance');
          console.log('');
          console.log(`- Mode: ${summary.mode}`);
          console.log(`- Cleaned: ${summary.cleaned ? 'yes' : 'no'}`);
          console.log(`- Dirty before: ${summary.dirtyBefore ? 'yes' : 'no'}`);
          console.log(`- Dirty after: ${summary.dirtyAfter ? 'yes' : 'no'}`);
          console.log(`- Tracked change count before: ${summary.trackedChangeCountBefore}`);
          console.log(`- Backup root: ${summary.backupRoot}`);
          console.log(`- Patch SHA-256: ${summary.patchSha256}`);
          NODE
          fi
          if [ -f "$OUTPUT_ROOT/runtime-diagnostics-summary.json" ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const summary = JSON.parse(readFileSync(`${process.env.OUTPUT_ROOT}/runtime-diagnostics-summary.json`, 'utf8'));
          console.log('# Production Runtime Diagnostics');
          console.log('');
          console.log(`- API unhealthy signal: ${summary.apiUnhealthy ? 'yes' : 'no'}`);
          console.log(`- API exited signal: ${summary.apiExited ? 'yes' : 'no'}`);
          console.log(`- Health curl failed signal: ${summary.healthCurlFailed ? 'yes' : 'no'}`);
          console.log(`- Diagnostics only: ${summary.diagnosticsOnly ? 'yes' : 'no'}`);
          NODE
          fi
          if [ -f "$OUTPUT_ROOT/runtime-restart-summary.json" ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const summary = JSON.parse(readFileSync(`${process.env.OUTPUT_ROOT}/runtime-restart-summary.json`, 'utf8'));
          console.log('# Production Runtime Restart');
          console.log('');
          console.log(`- Release head: ${summary.releaseHead || 'unknown'}`);
          console.log(`- API status: ${summary.apiBeforeStatus} -> ${summary.apiAfterStatus}`);
          console.log(`- Web status: ${summary.webBeforeStatus} -> ${summary.webAfterStatus}`);
          console.log(`- Local health passed: ${summary.localHealthPassed ? 'yes' : 'no'}`);
          console.log(`- Public health passed: ${summary.publicHealthPassed ? 'yes' : 'no'}`);
          console.log(`- Recovery succeeded: ${summary.recoverySucceeded ? 'yes' : 'no'}`);
          NODE
          fi

      - name: Remove SSH key from runner
        if: always()
        run: |
          rm -f ~/.ssh/workbuddy-production-maintenance

      - name: Upload sanitized maintenance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-server-worktree-maintenance-${{ github.run_id }}
          path: |
            project-testing/reports/production-server-worktree-maintenance-${{ github.run_id }}/**/*
            !project-testing/reports/production-server-worktree-maintenance-${{ github.run_id }}/**/*.env
            !project-testing/reports/production-server-worktree-maintenance-${{ github.run_id }}/**/*.patch
            !project-testing/reports/production-server-worktree-maintenance-${{ github.run_id }}/**/*.raw.txt
          if-no-files-found: error
          retention-days: 14
