  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-workflow-contract:
    name: Deploy Workflow Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Test repository secret scan
        working-directory: .
        run: node --test scripts/guard-repository-secrets.test.mjs

      - name: Repository secret scan
        working-directory: .
        run: node scripts/guard-repository-secrets.mjs

      - name: Verify production runtime recovery contract
        working-directory: .
        run: node --test scripts/production-runtime-recovery.contract.test.mjs

      - name: Verify domain SNI ingress contract
        working-directory: .
        run: node --test scripts/domain-sni-ingress.contract.test.mjs

      - name: Verify application release atomicity contract
        working-directory: .
        run: node --test scripts/application-release-atomicity.contract.test.mjs

      - name: Enable pnpm via Corepack
        working-directory: .
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install server dependencies
        run: npm ci --workspaces=false

      - name: Build server for staging learning-cycle contract
        run: npm run build

      - name: Verify staging duration learning cycle v2 contract
        working-directory: .
        run: node --test project-testing/tools/run-duration-learning-cycle-v2-staging-contract.test.mjs

      - name: Test tracked relative import closure guard
        run: node --test scripts/guard-tracked-relative-import-closure.test.mjs

      - name: Verify tracked relative import closure
        run: npm run guard:tracked-relative-imports

      - name: Install client dependencies for readiness contract
        working-directory: .
        run: pnpm --dir client install --frozen-lockfile

      - name: Verify deploy workflow contract
        run: npm run verify:workflow-contract

      - name: Verify C-18.L evidence artifact contracts
        run: npm run verify:c18-live-evidence-contracts

      - name: Verify v1.4.23.1 client contracts
        working-directory: .
        run: npm run verify:v14231-client-contracts --workspace=client
