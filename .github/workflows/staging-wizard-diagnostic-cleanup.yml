name: Staging Wizard Diagnostic Cleanup

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed staging release SHA containing the guarded cleanup implementation
        required: true
        type: string
      source_run_id:
        description: Prior staging deploy run containing the disposable wizard smoke artifact
        required: true
        type: string
      cleanup_confirmation:
        description: Type CLEANUP_DISPOSABLE_STAGING_WIZARD_RESIDUE to authorize physical cleanup
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: lighthouse-host-runtime-mutation
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    name: Clean Exact Staging Wizard Diagnostic Project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      CLEANUP_CONFIRMATION: ${{ inputs.cleanup_confirmation }}
      DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.STAGING_DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
      DEPLOY_HEALTH_URL: ${{ secrets.STAGING_DEPLOY_HEALTH_URL }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.STAGING_DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_TEST_USER_EMAIL: ${{ secrets.STAGING_TEST_USER_EMAIL }}
      STAGING_TEST_USER_PASSWORD: ${{ secrets.STAGING_TEST_USER_PASSWORD }}
      WORKBUDDY_DIAGNOSTIC_CLEANUP_DATABASE_URL: ${{ secrets.STAGING_SUPABASE_MIGRATION_URL }}

    steps:
      - name: Checkout exact cleanup release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate exact staging cleanup authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$CLEANUP_CONFIRMATION" = "CLEANUP_DISPOSABLE_STAGING_WIZARD_RESIDUE"
          for required_name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_HEALTH_URL DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS STAGING_SUPABASE_URL STAGING_TEST_USER_EMAIL STAGING_TEST_USER_PASSWORD WORKBUDDY_DIAGNOSTIC_CLEANUP_DATABASE_URL; do
            if [ -z "${!required_name}" ]; then
              echo "Missing required staging cleanup value: $required_name" >&2
              exit 1
            fi
          done

      - name: Install cleanup dependencies
        run: npm ci --workspaces=false --ignore-scripts --no-fund

      - name: Configure pinned staging SSH identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/workbuddy-staging-cleanup
          chmod 600 ~/.ssh/workbuddy-staging-cleanup
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Download exact prior staging wizard smoke
        uses: actions/download-artifact@v7
        with:
          name: staging-wizard-baseline-revision-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/staging-wizard-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Physically clean and read back the exact diagnostic project
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          source_smoke_report="$RUNNER_TEMP/staging-wizard-source/staging-wizard-baseline-revision.json"
          cleanup_report="$RUNNER_TEMP/staging-wizard-residual-cleanup.json"
          smoke_env="$RUNNER_TEMP/staging-wizard-cleanup.env"
          readyz_file="$RUNNER_TEMP/staging-wizard-cleanup.readyz.json"
          build_file="$RUNNER_TEMP/staging-wizard-cleanup.build.json"
          local_smoke_port=18084
          tunnel_pid=""
          cleanup_local() {
            rm -f "$smoke_env"
            if [ -n "$tunnel_pid" ]; then kill "$tunnel_pid" 2>/dev/null || true; fi
          }
          trap cleanup_local EXIT

          test -s "$source_smoke_report"
          expected_project_ref="$(node -e "const value=new URL(process.env.STAGING_SUPABASE_URL).hostname.split('.')[0]; if(!/^[a-z0-9]{20}$/.test(value)) process.exit(1); process.stdout.write(value)")"
          node - "$source_smoke_report" "$expected_project_ref" <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const expectedProjectRef = process.argv[3]
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
          if (report?.source !== 'wizard_baseline_revision_live_probe'
            || report?.targetEnvironment !== 'staging'
            || report?.supabaseProjectRef !== expectedProjectRef
            || !uuid.test(String(report?.projectId ?? ''))
            || !uuid.test(String(report?.companyId ?? ''))
            || !/^staging-baseline-\d{13}$/.test(String(report?.diagnosticRunId ?? ''))
            || report?.projectName !== `Disposable Residential Baseline ${report?.diagnosticRunId}`
            || !/^[0-9a-f]{40}$/.test(String(report?.releaseSha ?? ''))) {
            throw new Error('source staging wizard artifact identity is invalid')
          }
          NODE

          printf 'SUPABASE_URL=%s\nTEST_USERNAME=%s\nTEST_USER_PASSWORD=%s\n' \
            "$STAGING_SUPABASE_URL" \
            "$STAGING_TEST_USER_EMAIL" \
            "$STAGING_TEST_USER_PASSWORD" \
            > "$smoke_env"
          chmod 600 "$smoke_env"

          remote_web_port="$(ssh \
            -i ~/.ssh/workbuddy-staging-cleanup \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "awk -F= '\$1 == \"WEB_PORT\" { value=\$2 } END { gsub(/\\r/, \"\", value); print value }' \"$DEPLOY_PATH/deploy/env/server.production.env\"")"
          remote_web_port="${remote_web_port:-8080}"
          [[ "$remote_web_port" =~ ^[0-9]{2,5}$ ]]
          ssh -N -L "127.0.0.1:${local_smoke_port}:127.0.0.1:${remote_web_port}" \
            -i ~/.ssh/workbuddy-staging-cleanup \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o ExitOnForwardFailure=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" &
          tunnel_pid=$!

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "http://127.0.0.1:${local_smoke_port}/api/readyz" > "$readyz_file"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Staging cleanup tunnel did not become ready." >&2
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            "http://127.0.0.1:${local_smoke_port}/workbuddy-build.json" \
            > "$build_file"
          node - "$readyz_file" "$build_file" "$expected_project_ref" <<'NODE'
          const fs = require('node:fs')
          const readiness = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const manifest = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
          const expectedProjectRef = process.argv[4]
          if (readiness?.build?.releaseSha !== process.env.RELEASE_SHA
            || readiness?.build?.deployTarget !== 'staging'
            || readiness?.build?.supabaseProjectRef !== expectedProjectRef
            || readiness?.build?.databaseProjectRef !== expectedProjectRef
            || manifest?.releaseSha !== process.env.RELEASE_SHA) {
            throw new Error('deployed staging cleanup target identity mismatch')
          }
          NODE

          public_origin="$(node -e "process.stdout.write(new URL(process.env.DEPLOY_HEALTH_URL).origin)")"
          node scripts/run-wizard-baseline-revision-staging.mjs \
            --env-file "$smoke_env" \
            --api-base-url "http://127.0.0.1:${local_smoke_port}" \
            --public-origin "$public_origin" \
            --cleanup-report "$source_smoke_report" \
            --report "$cleanup_report" \
            --deployed-staging-code \
            --expected-project-ref "$expected_project_ref" \
            --release-sha "$RELEASE_SHA" \
            --request-timeout-ms 20000
          node - "$source_smoke_report" "$cleanup_report" <<'NODE'
          const fs = require('node:fs')
          const source = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const cleanup = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
          if (cleanup?.status !== 'pass'
            || cleanup?.projectId !== source?.projectId
            || cleanup?.cleanup?.projectPhysicallyDeleted !== true
            || cleanup?.cleanup?.projectUnreadable !== true
            || cleanup?.cleanup?.databaseProjectRefVerified !== true
            || cleanup?.cleanup?.directCleanupStrategy !== 'migration_connection_guarded_diagnostic_cleanup') {
            throw new Error('staging wizard diagnostic cleanup failed closed')
          }
          NODE

      - name: Upload staging wizard cleanup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-wizard-diagnostic-cleanup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/staging-wizard-residual-cleanup.json
            ${{ runner.temp }}/staging-wizard-cleanup.readyz.json
            ${{ runner.temp }}/staging-wizard-cleanup.build.json
          if-no-files-found: warn
          retention-days: 14
