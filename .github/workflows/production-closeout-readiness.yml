name: Production Closeout Readiness

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production public base URL. Leave blank to use WORKBUDDY_LIVE_BASE_URL/API_BASE_URL from server env, then GitHub deployment URL.
        required: false
        default: ''
        type: string
      company_id:
        description: Production company id for controlled closeout readiness. Leave blank for read-only DB discovery.
        required: false
        default: ''
        type: string
      project_id:
        description: Production project id for controlled closeout readiness. Leave blank for read-only DB discovery.
        required: false
        default: ''
        type: string
      plan_id:
        description: Production plan id for C18 diagnostics readiness. Leave blank for read-only DB discovery.
        required: false
        default: ''
        type: string
      candidate_id:
        description: Production C15 candidate id for readiness; use a governed candidate only. Leave blank for read-only DB discovery.
        required: false
        default: ''
        type: string
      approval_ref:
        description: Approval or change-ticket reference authorizing readiness evaluation
        required: false
        default: ''
        type: string
      sample_cohort_ref:
        description: Optional C15 sample cohort evidence reference
        required: false
        default: ''
        type: string
      phase1_l5_ref:
        description: Optional C19 phase-1/L5 handoff evidence reference
        required: false
        default: ''
        type: string
      release_closure_artifact_ref:
        description: Optional C19 release closure artifact reference
        required: false
        default: ''
        type: string
      rollback_target_ref:
        description: Optional C19 rollback target reference
        required: false
        default: ''
        type: string
      monitoring_window:
        description: Optional production observation window, for example 2026-06-30T21:00:00+08:00/PT30M
        required: false
        default: ''
        type: string

concurrency:
  group: production-closeout-readiness-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    name: Readiness Only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install readiness dependencies
        run: npm ci

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_PRIVATE_KEY" ]; then
            echo "Missing required deploy SSH secrets." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/workbuddy-production-closeout
          chmod 600 ~/.ssh/workbuddy-production-closeout
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Fetch production env from self-hosted server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "Missing required deploy location secrets." >&2
            exit 1
          fi
          mkdir -p deploy/env
          remote_env="$DEPLOY_PATH/deploy/env/server.production.env"
          ssh -i ~/.ssh/workbuddy-production-closeout -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -s '$remote_env'"
          scp -i ~/.ssh/workbuddy-production-closeout -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_env" deploy/env/server.production.env
          test -s deploy/env/server.production.env

      - name: Collect server-side discovery signals
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          OUTPUT_ROOT: project-testing/reports/production-closeout-readiness-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          local_blocked_signals="$OUTPUT_ROOT/server-handoff-signals.json"
          local_collector="project-testing/tools/collect-release-handoff-signals.mjs"
          remote_root="$DEPLOY_PATH/.workbuddy-production-closeout-readiness/${GITHUB_RUN_ID}"
          remote_collector_host="$remote_root/collect-release-handoff-signals.mjs"
          remote_collector_container="/tmp/workbuddy-production-closeout-readiness-${GITHUB_RUN_ID}.mjs"
          remote_signals_host="$remote_root/handoff-signals.json"
          remote_env="$DEPLOY_PATH/deploy/env/server.production.env"

          write_blocked_signals() {
            node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const reason = String(process.env.BLOCKED_REASON || 'server-side discovery failed')
            .replace(/[\r\n]/g, ' ')
            .slice(0, 200);
          const output = process.env.BLOCKED_SIGNALS_FILE;
          writeFileSync(output, `${JSON.stringify({
            schemaVersion: 'workbuddy-release-handoff-signals/v1',
            generatedAt: new Date().toISOString(),
            connectivity: {
              db: {
                ok: false,
                databaseTargetRef: 'env://deploy/env/server.production.env#SUPABASE_MIGRATION_URL',
                error: reason,
                discoverySource: 'server-side-ssh-discovery',
              },
            },
            tableCounts: {},
            columns: {},
            discoveredTargets: {
              companyId: '',
              projectId: '',
              planId: '',
              candidateId: '',
              sampleCohortRef: '',
            },
            boundary: {
              noSecretValuesWritten: true,
              liveMutation: false,
              dbMutation: false,
              note: 'Server-side discovery failed before target IDs could be read. This file is sanitized and contains no env values.',
            },
          }, null, 2)}\n`);
          NODE
          }

          if ssh -i ~/.ssh/workbuddy-production-closeout -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$remote_root' && test -s '$remote_env' && (docker ps --format '{{.Names}}' 2>/dev/null || sudo -n docker ps --format '{{.Names}}') | grep -qx 'project-management-api'"; then
            scp -i ~/.ssh/workbuddy-production-closeout -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
              "$local_collector" "$DEPLOY_USER@$DEPLOY_HOST:$remote_collector_host"

            if ssh -i ~/.ssh/workbuddy-production-closeout -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -e; if docker info >/dev/null 2>&1; then docker_cmd='docker'; elif sudo -n docker info >/dev/null 2>&1; then docker_cmd='sudo -n docker'; else exit 1; fi; \$docker_cmd cp '$remote_collector_host' project-management-api:'$remote_collector_container'; \$docker_cmd exec project-management-api sh -lc \"mkdir -p /tmp/workbuddy-production-closeout-readiness-${GITHUB_RUN_ID} && node '$remote_collector_container' --env-source process --env-file deploy/env/server.production.env --output-dir /tmp/workbuddy-production-closeout-readiness-${GITHUB_RUN_ID} --include-live --confirm-live-handoff --include-db --confirm-db-ready --environment-owner github-actions-production-closeout --write-approval-ref 'github-actions://run/${GITHUB_RUN_ID}' --manual-approval-ref 'github-actions://run/${GITHUB_RUN_ID}' --monitoring-owner github-actions-production-closeout --rollback-owner github-actions-production-closeout --cleanup-owner github-actions-production-closeout --migration-owner github-actions-production-closeout --runtime-publication-owner github-actions-production-closeout --consumer-observation-owner github-actions-production-closeout >/dev/null\"; \$docker_cmd cp project-management-api:/tmp/workbuddy-production-closeout-readiness-${GITHUB_RUN_ID}/handoff-signals.json '$remote_signals_host'; \$docker_cmd exec project-management-api sh -lc \"rm -rf /tmp/workbuddy-production-closeout-readiness-${GITHUB_RUN_ID} '$remote_collector_container'\""; then
              scp -i ~/.ssh/workbuddy-production-closeout -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
                "$DEPLOY_USER@$DEPLOY_HOST:$remote_signals_host" "$local_blocked_signals"
            else
              BLOCKED_REASON="server-side discovery command failed" BLOCKED_SIGNALS_FILE="$local_blocked_signals" write_blocked_signals
            fi

            ssh -i ~/.ssh/workbuddy-production-closeout -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "rm -rf '$remote_root'" >/dev/null 2>&1 || true
          else
            BLOCKED_REASON="server-side discovery setup failed" BLOCKED_SIGNALS_FILE="$local_blocked_signals" write_blocked_signals
          fi

          test -s "$local_blocked_signals"

      - name: Generate production readiness report
        env:
          OUTPUT_ROOT: project-testing/reports/production-closeout-readiness-${{ github.run_id }}
          BASE_URL: ${{ inputs.base_url }}
          DEPLOYMENT_URL: ${{ github.event.repository.homepage }}
          COMPANY_ID: ${{ inputs.company_id }}
          PROJECT_ID: ${{ inputs.project_id }}
          PLAN_ID: ${{ inputs.plan_id }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          SAMPLE_COHORT_REF: ${{ inputs.sample_cohort_ref }}
          PHASE1_L5_REF: ${{ inputs.phase1_l5_ref }}
          RELEASE_CLOSURE_ARTIFACT_REF: ${{ inputs.release_closure_artifact_ref }}
          ROLLBACK_TARGET_REF: ${{ inputs.rollback_target_ref }}
          MONITORING_WINDOW: ${{ inputs.monitoring_window }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"

          node project-testing/tools/collect-release-handoff-signals.mjs \
            --env-file deploy/env/server.production.env \
            --output-dir "$OUTPUT_ROOT" \
            --server-signals-file "$OUTPUT_ROOT/server-handoff-signals.json" \
            --include-live \
            --confirm-live-handoff \
            --include-db \
            --confirm-db-ready \
            --environment-owner github-actions-production-closeout \
            --write-approval-ref "${APPROVAL_REF:-github-actions://run/${GITHUB_RUN_ID}}" \
            --manual-approval-ref "${APPROVAL_REF:-github-actions://run/${GITHUB_RUN_ID}}" \
            --monitoring-owner github-actions-production-closeout \
            --rollback-owner github-actions-production-closeout \
            --cleanup-owner github-actions-production-closeout \
            --migration-owner github-actions-production-closeout \
            --runtime-publication-owner github-actions-production-closeout \
            --consumer-observation-owner github-actions-production-closeout

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const outputRoot = process.env.OUTPUT_ROOT;
          const signals = JSON.parse(readFileSync(`${outputRoot}/handoff-signals.json`, 'utf8'));
          const discovered = signals.discoveredTargets ?? {};
          const env = process.env;
          const fill = (key, fallback = '') => String(env[key] || discovered[key] || fallback || '').trim();
          const baseUrl = String(env.BASE_URL || '').trim()
            || String(signals.baseUrl || '').trim()
            || String(env.DEPLOYMENT_URL || '').trim();
          const monitoringWindow = String(env.MONITORING_WINDOW || '').trim()
            || `${new Date().toISOString()}/PT30M`;
          const values = {
            BASE_URL: baseUrl,
            COMPANY_ID: fill('COMPANY_ID'),
            PROJECT_ID: fill('PROJECT_ID'),
            PLAN_ID: fill('PLAN_ID'),
            CANDIDATE_ID: fill('CANDIDATE_ID'),
            APPROVAL_REF: String(env.APPROVAL_REF || `github-actions://run/${env.GITHUB_RUN_ID}`).trim(),
            SAMPLE_COHORT_REF: fill('SAMPLE_COHORT_REF', discovered.sampleCohortRef),
            MONITORING_WINDOW: monitoringWindow,
          };
          const shellQuote = (value) => `'${String(value).replace(/'/g, `'\\''`).replace(/\n/g, '')}'`;
          writeFileSync(
            `${outputRoot}/production-readiness-inputs.env`,
            Object.entries(values).map(([key, value]) => `${key}=${shellQuote(value)}`).join('\n') + '\n',
          );
          NODE

          # shellcheck disable=SC1090
          source "$OUTPUT_ROOT/production-readiness-inputs.env"

          args=(
            --env-file deploy/env/server.production.env
            --output-root "$OUTPUT_ROOT"
          )
          if [ -n "$BASE_URL" ]; then
            args+=(--base-url "$BASE_URL")
          fi
          if [ -n "$COMPANY_ID" ]; then
            args+=(--company-id "$COMPANY_ID")
          fi
          if [ -n "$PROJECT_ID" ]; then
            args+=(--project-id "$PROJECT_ID")
          fi
          if [ -n "$PLAN_ID" ]; then
            args+=(--plan-id "$PLAN_ID")
          fi
          if [ -n "$CANDIDATE_ID" ]; then
            args+=(--candidate-id "$CANDIDATE_ID")
          fi
          if [ -n "$APPROVAL_REF" ]; then
            args+=(--approval-ref "$APPROVAL_REF")
          fi
          if [ -n "$SAMPLE_COHORT_REF" ]; then
            args+=(--sample-cohort-ref "$SAMPLE_COHORT_REF")
          fi
          if [ -n "$PHASE1_L5_REF" ]; then
            args+=(--phase1-l5-ref "$PHASE1_L5_REF")
          fi
          if [ -n "$RELEASE_CLOSURE_ARTIFACT_REF" ]; then
            args+=(--release-closure-artifact-ref "$RELEASE_CLOSURE_ARTIFACT_REF")
          fi
          if [ -n "$ROLLBACK_TARGET_REF" ]; then
            args+=(--rollback-target-ref "$ROLLBACK_TARGET_REF")
          fi
          if [ -n "$MONITORING_WINDOW" ]; then
            args+=(--monitoring-window "$MONITORING_WINDOW")
          fi
          node project-testing/tools/prepare-production-closeout-readiness.mjs "${args[@]}"

      - name: Publish readiness summary
        if: always()
        env:
          OUTPUT_ROOT: project-testing/reports/production-closeout-readiness-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -f "$OUTPUT_ROOT/handoff-readiness.md" ]; then
            cat "$OUTPUT_ROOT/handoff-readiness.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$OUTPUT_ROOT/closeout-status-index.md" ]; then
            {
              echo ""
              echo "## Closeout Status Index"
              echo ""
              cat "$OUTPUT_ROOT/closeout-status-index.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove production env from runner
        if: always()
        run: |
          rm -f deploy/env/server.production.env
          rm -f ~/.ssh/workbuddy-production-closeout

      - name: Upload sanitized readiness reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-closeout-readiness-${{ github.run_id }}
          path: |
            project-testing/reports/production-closeout-readiness-${{ github.run_id }}/**/*
            !project-testing/reports/production-closeout-readiness-${{ github.run_id }}/**/*.env
          if-no-files-found: error
          retention-days: 14
